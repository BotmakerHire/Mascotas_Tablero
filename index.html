<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omint Mascotas — Dashboard v2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-primary: #0a0e1a;
    --bg-card: #131829;
    --bg-card-hover: #1a2038;
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.12);
    --text-primary: #e8ecf4;
    --text-secondary: #8b93a7;
    --text-muted: #5a6178;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --green: #10b981;
    --orange: #f59e0b;
    --red: #ef4444;
    --blue: #3b82f6;
    --pink: #ec4899;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 24px;
    background-image:
      radial-gradient(at 20% 0%, rgba(99,102,241,0.08) 0px, transparent 50%),
      radial-gradient(at 80% 100%, rgba(139,92,246,0.08) 0px, transparent 50%);
  }

  .container { max-width: 1400px; margin: 0 auto; }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header-left h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-left p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: rgba(16,185,129,0.12);
    border: 1px solid rgba(16,185,129,0.3);
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .live-dot {
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(16,185,129,0.6); }
    50% { opacity: 0.7; transform: scale(1.1); box-shadow: 0 0 0 6px rgba(16,185,129,0); }
  }

  /* FILTROS DE RANGO */
  .range-filters {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .range-btn {
    padding: 8px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .range-btn:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-strong);
    color: var(--text-primary);
  }
  .range-btn.active {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: white;
  }
  .custom-range {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-left: auto;
  }
  .custom-range input {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    padding: 7px 10px;
    font-size: 12px;
    font-family: inherit;
    color-scheme: dark;
  }
  .custom-range button {
    padding: 7px 14px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  /* SECTIONS */
  .section { margin-bottom: 24px; }
  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* KPIs */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
  .kpi {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    position: relative;
    overflow: hidden;
    transition: all 0.2s ease;
  }
  .kpi::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .kpi:hover { background: var(--bg-card-hover); }
  .kpi:hover::before { opacity: 1; }
  .kpi-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .kpi-value {
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -1px;
    margin-bottom: 6px;
  }
  .kpi-sub {
    font-size: 11px;
    color: var(--text-secondary);
  }
  .kpi-delta {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    margin-top: 4px;
  }
  .kpi-delta.up { color: var(--green); }
  .kpi-delta.down { color: var(--red); }
  .kpi-delta.flat { color: var(--text-muted); }

  /* FUNNEL CARD */
  .funnel-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .funnel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .funnel-title { font-size: 14px; font-weight: 600; }
  .funnel-segments {
    display: flex;
    gap: 4px;
  }
  .seg-btn {
    padding: 5px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .seg-btn:hover {
    border-color: var(--border-strong);
    color: var(--text-primary);
  }
  .seg-btn.active {
    background: rgba(99,102,241,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  .funnel-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .funnel-table th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 600;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .funnel-table th.num { text-align: right; }
  .funnel-table td {
    padding: 12px 8px;
    border-bottom: 1px solid var(--border);
  }
  .funnel-table td.num {
    text-align: right;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .funnel-table tr:last-child td { border-bottom: none; }
  .funnel-table tr.split td {
    background: rgba(99,102,241,0.06);
    font-style: italic;
    color: var(--text-muted);
    font-size: 11px;
    padding: 6px 8px;
  }
  .pct-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .pct-pill.low { background: rgba(16,185,129,0.15); color: var(--green); }
  .pct-pill.mid { background: rgba(245,158,11,0.15); color: var(--orange); }
  .pct-pill.high { background: rgba(239,68,68,0.15); color: var(--red); }
  .pct-pill.neutral { background: rgba(255,255,255,0.05); color: var(--text-muted); }

  /* TWO COL */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 900px) {
    .two-col { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .card-subtitle { font-size: 11px; color: var(--text-secondary); margin-bottom: 16px; }

  /* AB TESTING */
  .ab-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .ab-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    position: relative;
  }
  .ab-card.winner {
    background: rgba(16,185,129,0.06);
    border-color: rgba(16,185,129,0.3);
  }
  .ab-name {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .ab-tasa {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }
  .ab-card.winner .ab-tasa { color: var(--green); }
  .ab-conv {
    font-size: 11px;
    color: var(--text-secondary);
  }
  .ab-winner-banner {
    padding: 10px 12px;
    background: rgba(16,185,129,0.08);
    border: 1px solid rgba(16,185,129,0.25);
    border-radius: 10px;
    font-size: 12px;
    color: var(--green);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* PERFORMANCE AGENTE */
  .perf-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .perf-table th, .perf-table td {
    padding: 10px 6px;
    text-align: right;
  }
  .perf-table th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
  }
  .perf-table td {
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  .perf-table tr:last-child td { border-bottom: none; }
  .perf-table th:first-child, .perf-table td:first-child {
    text-align: left;
    font-weight: 600;
  }
  .perf-table .valido { color: var(--green); }
  .perf-table .invalido { color: var(--orange); }
  .perf-table .vacio { color: var(--red); }

  /* CHART */
  .chart-container { position: relative; height: 220px; }

  /* CAMPAÑAS */
  .camp-list {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .camp-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .camp-row {
    display: grid;
    grid-template-columns: 50px 24px 1fr 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    margin-bottom: 4px;
    font-size: 12px;
  }
  .camp-fecha {
    color: var(--text-secondary);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .camp-icon { font-size: 14px; }
  .camp-canal {
    color: var(--text-primary);
    text-transform: capitalize;
  }
  .camp-tipo {
    color: var(--text-secondary);
    font-size: 11px;
    font-family: monospace;
  }
  .camp-cantidad {
    color: var(--text-primary);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .camp-empty {
    margin-top: 16px;
    padding: 12px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .footer span { color: var(--text-secondary); font-weight: 500; }

  .loading {
    text-align: center;
    padding: 80px;
    color: var(--text-secondary);
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-left">
      <h1>🐾 Omint Mascotas</h1>
      <p>Dashboard de actividad del bot</p>
    </div>
    <div class="live-badge">
      <span class="live-dot"></span>
      <span>En vivo</span>
    </div>
  </div>

  <div class="range-filters" id="rangeFilters">
    <button class="range-btn active" data-range="hoy">Hoy</button>
    <button class="range-btn" data-range="ayer">Ayer</button>
    <button class="range-btn" data-range="7d">Últimos 7 días</button>
    <button class="range-btn" data-range="30d">Últimos 30 días</button>
    <button class="range-btn" data-range="mes_actual">Mes actual</button>
    <div class="custom-range">
      <input type="date" id="customFrom">
      <span style="color:var(--text-muted);">→</span>
      <input type="date" id="customTo">
      <button id="customApply">Aplicar</button>
    </div>
  </div>

  <div id="content" class="loading">Cargando datos...</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz4tunzLedk288CXnJ2uWel6nfeIa4iJV1pR7RFClPceSRh382FH5sB2wUVt5ThjCof/exec";
const REFRESH_MS = 60000;
let chartEvolucion = null;
let currentRange = "hoy";
let currentFrom = null;
let currentTo = null;
let currentSegmento = "todos";

// HELPERS
const tiempoRelativo = (iso) => {
  if (!iso) return 'sin actividad';
  const d = new Date(iso);
  const diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60) return `hace ${diff}s`;
  if (diff < 3600) return `hace ${Math.floor(diff/60)} min`;
  if (diff < 86400) return `hace ${Math.floor(diff/3600)} hs`;
  return `hace ${Math.floor(diff/86400)} días`;
};

const pct = (a, b) => b === 0 ? '0%' : Math.round((a/b)*100) + '%';

const delta = (a, b) => {
  if (b === 0 && a === 0) return { val: 0, label: '—', cls: 'flat' };
  if (b === 0) return { val: 100, label: 'nuevo', cls: 'up' };
  const d = Math.round(((a - b) / b) * 100);
  if (d === 0) return { val: 0, label: '0%', cls: 'flat' };
  return {
    val: d,
    label: (d > 0 ? '+' : '') + d + '% vs anterior',
    cls: d > 0 ? 'up' : 'down'
  };
};

// FETCH
async function cargar() {
  try {
    let url = `${API_URL}?range=${currentRange}`;
    if (currentRange === 'custom' && currentFrom && currentTo) {
      url += `&from=${currentFrom}&to=${currentTo}`;
    }
    const res = await fetch(url);
    const d = await res.json();
    if (d.error) {
      document.getElementById('content').innerHTML = `<div class="loading">Error: ${d.error}</div>`;
      return;
    }
    render(d);
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="loading">Error al cargar datos. Reintentando...</div>`;
  }
}

// RENDER
function render(d) {
  const f = d.funnel;
  const fAnt = d.funnel_anterior;
  const seg = d.segmentos_agente;
  const ab = d.ab_testing;

  // Determinar ganador A/B
  const tasaA = ab.cliente_promo_a.tasa;
  const tasaB = ab.cliente_promo_b.tasa;
  const sesA = ab.cliente_promo_a.sesiones;
  const sesB = ab.cliente_promo_b.sesiones;
  let winnerHTML = '';
  if (sesA > 0 || sesB > 0) {
    if (tasaA > tasaB) winnerHTML = `🏆 <strong>Promo A</strong> gana por ${(tasaA - tasaB).toFixed(1)} pts`;
    else if (tasaB > tasaA) winnerHTML = `🏆 <strong>Promo B</strong> gana por ${(tasaB - tasaA).toFixed(1)} pts`;
    else winnerHTML = `⚖️ Empate técnico`;
  } else {
    winnerHTML = `📊 Sin datos suficientes en el período`;
  }

  // Funnel pasos
  const segKey = currentSegmento === "todos" ? "total" : currentSegmento;
  const pasos = [
    { label: 'Ingresaron al bot',  key: 'saludo_inicial', color: 'linear-gradient(90deg,#6366f1,#818cf8)' },
    { label: 'Pidieron cotizar',   key: 'quiero_cotizar', color: 'linear-gradient(90deg,#3b82f6,#60a5fa)' },
    { label: 'Pasaron al agente IA', key: 'pre_agente',   color: 'linear-gradient(90deg,#8b5cf6,#a78bfa)', splitBefore: true },
    { label: 'Llegaron a confirmar', key: 'pre_confirma', color: 'linear-gradient(90deg,#ec4899,#f472b6)' },
    { label: 'Confirmaron plan',   key: 'confirmo',       color: 'linear-gradient(90deg,#f59e0b,#fbbf24)' },
    { label: 'Completaron alta',   key: 'fin_onboarding', color: 'linear-gradient(90deg,#10b981,#34d399)' }
  ];

  const valor = (etapa) => f[etapa][segKey] || 0;
  const valorAnt = (etapa) => fAnt[etapa][segKey] || 0;

  // KPIs principales
  const totalSaludos = valor('saludo_inicial');
  const totalSaludosAnt = valorAnt('saludo_inicial');
  const totalConfirmo = valor('confirmo');
  const totalAlta = valor('fin_onboarding');
  const tasaConf = totalSaludos > 0 ? Math.round((totalConfirmo/totalSaludos)*100) : 0;
  const tasaAlta = totalSaludos > 0 ? Math.round((totalAlta/totalSaludos)*100) : 0;

  const dLeads = delta(totalSaludos, totalSaludosAnt);
  const dConf = delta(totalConfirmo, valorAnt('confirmo'));
  const dAltas = delta(d.altas.rango, d.altas.anterior);

  document.getElementById('content').innerHTML = `

    <div class="section">
      <div class="section-title">Resumen · ${d.rango.label}</div>
      <div class="kpi-grid">
        <div class="kpi">
          <div class="kpi-label">Ingresos al bot</div>
          <div class="kpi-value">${totalSaludos}</div>
          <div class="kpi-sub">usuarios únicos</div>
          <div class="kpi-delta ${dLeads.cls}">${dLeads.label}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Confirmaron plan</div>
          <div class="kpi-value">${totalConfirmo}</div>
          <div class="kpi-sub">${tasaConf}% conversión</div>
          <div class="kpi-delta ${dConf.cls}">${dConf.label}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Altas completadas</div>
          <div class="kpi-value">${d.altas.rango}</div>
          <div class="kpi-sub">${tasaAlta}% sobre ingresos</div>
          <div class="kpi-delta ${dAltas.cls}">${dAltas.label}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Última actividad</div>
          <div class="kpi-value" style="font-size:22px;">${tiempoRelativo(d.ultima_actividad)}</div>
          <div class="kpi-sub">timestamp más reciente</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Funnel segmentado por promo</div>
      <div class="funnel-card">
        <div class="funnel-header">
          <div class="funnel-title">Embudo del período · vista <span style="color:var(--accent);">${segLabel(currentSegmento)}</span></div>
          <div class="funnel-segments" id="segBtns">
            <button class="seg-btn ${currentSegmento==='todos'?'active':''}" data-seg="todos">Todos</button>
            <button class="seg-btn ${currentSegmento==='cliente_promo_a'?'active':''}" data-seg="cliente_promo_a">Promo A</button>
            <button class="seg-btn ${currentSegmento==='cliente_promo_b'?'active':''}" data-seg="cliente_promo_b">Promo B</button>
            <button class="seg-btn ${currentSegmento==='empleado'?'active':''}" data-seg="empleado">Empleado</button>
          </div>
        </div>

        <table class="funnel-table">
          <thead>
            <tr>
              <th>Etapa</th>
              <th class="num">Total</th>
              <th class="num">Promo A</th>
              <th class="num">Promo B</th>
              <th class="num">Empleado</th>
              <th class="num">% inicio</th>
              <th class="num">Drop</th>
            </tr>
          </thead>
          <tbody>
            ${pasos.map((p, i) => {
              const total = f[p.key].total;
              const promoA = f[p.key].cliente_promo_a;
              const promoB = f[p.key].cliente_promo_b;
              const empleado = f[p.key].empleado;
              const pctInicio = pct(total, f.saludo_inicial.total);

              let dropHTML = '';
              if (i === 0) {
                dropHTML = `<span class="pct-pill neutral">inicio</span>`;
              } else {
                const prev = f[pasos[i-1].key].total;
                if (prev === 0) {
                  dropHTML = `<span class="pct-pill neutral">—</span>`;
                } else {
                  const drop = Math.round(((prev - total) / prev) * 100);
                  let cls = 'low';
                  if (drop > 50) cls = 'high';
                  else if (drop > 20) cls = 'mid';
                  else if (drop <= 0) cls = 'neutral';
                  const signo = drop > 0 ? '−' : (drop < 0 ? '+' : '');
                  dropHTML = `<span class="pct-pill ${cls}">${signo}${Math.abs(drop)}%</span>`;
                }
              }

              const splitRow = p.splitBefore ? `
                <tr class="split">
                  <td colspan="7">↳ a partir de acá el bot identifica al titular y se puede segmentar por promo</td>
                </tr>
              ` : '';

              return `
                ${splitRow}
                <tr>
                  <td>${p.label}</td>
                  <td class="num">${total}</td>
                  <td class="num" style="color:${promoA>0?'var(--text-primary)':'var(--text-muted)'};">${promoA}</td>
                  <td class="num" style="color:${promoB>0?'var(--text-primary)':'var(--text-muted)'};">${promoB}</td>
                  <td class="num" style="color:${empleado>0?'var(--text-primary)':'var(--text-muted)'};">${empleado}</td>
                  <td class="num" style="color:var(--text-secondary);">${pctInicio}</td>
                  <td class="num">${dropHTML}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Evolución diaria</div>
      <div class="card">
        <div class="card-title">Tendencia del período</div>
        <div class="card-subtitle">Leads · Confirmaciones · Altas · Campañas (marcadores)</div>
        <div class="chart-container">
          <canvas id="chartEvolucion"></canvas>
        </div>
        ${renderCampanias(d.campanias)}
      </div>
    </div>

    <div class="section" style="margin-top:24px;">
      <div class="section-title">Sesiones del agente IA por segmento</div>
      <div class="card">
        <table class="perf-table">
          <thead>
            <tr>
              <th>Segmento</th>
              <th>Sesiones</th>
            </tr>
          </thead>
          <tbody>
            ${renderPerfRow('Cliente con Promo (A)', seg.cliente_promo_a)}
            ${renderPerfRow('Cliente sin Promo (B)', seg.cliente_promo_b)}
            ${renderPerfRow('Empleado', seg.empleado)}
          </tbody>
        </table>
      </div>
    </div>

    <div class="footer">
      Actualizado <span>${new Date(d.timestamp).toLocaleString('es-AR')}</span> · Auto-refresh cada 60s · Rango: <span>${d.rango.from} → ${d.rango.to}</span>
    </div>
  `;

  // Re-bind seg buttons
  document.querySelectorAll('#segBtns .seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentSegmento = btn.dataset.seg;
      render(d);
    });
  });

  renderChart(d.evolucion, d.campanias);
}

function segLabel(s) {
  return {
    'todos': 'Todos',
    'cliente_promo_a': 'Promo A',
    'cliente_promo_b': 'Promo B',
    'empleado': 'Empleado'
  }[s] || s;
}

function renderCampanias(campanias) {
  if (!campanias || campanias.length === 0) {
    return `<div class="camp-empty">📭 Sin campañas en el período</div>`;
  }

  const iconCanal = (canal) => {
    const c = (canal || "").toLowerCase();
    if (c.includes("mail") || c.includes("email")) return "📧";
    if (c.includes("whatsapp") || c.includes("wpp")) return "💬";
    if (c.includes("sms")) return "📱";
    return "📣";
  };

  const totalEnvios = campanias.reduce((a, c) => a + (c.cantidad || 0), 0);

  return `
    <div class="camp-list">
      <div class="camp-header">
        <span>📣 Campañas en el período</span>
        <span style="color:var(--text-muted);">${campanias.length} campaña${campanias.length>1?'s':''} · ${totalEnvios.toLocaleString('es-AR')} envíos</span>
      </div>
      ${campanias.map(c => `
        <div class="camp-row">
          <span class="camp-fecha">${c.fecha_label}</span>
          <span class="camp-icon">${iconCanal(c.canal)}</span>
          <span class="camp-canal">${c.canal}</span>
          <span class="camp-tipo">${c.tipo}</span>
          <span class="camp-cantidad">${c.cantidad.toLocaleString('es-AR')}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderPerfRow(nombre, data) {
  return `
    <tr>
      <td>${nombre}</td>
      <td>${data.total}</td>
    </tr>
  `;
}

function renderChart(evolucion, campanias) {
  const ctx = document.getElementById('chartEvolucion').getContext('2d');
  if (chartEvolucion) chartEvolucion.destroy();

  // Mapeo de campañas a posición en el eje X (por fecha_label)
  const labelsChart = evolucion.map(e => e.fecha);
  const camPorLabel = {};
  if (campanias && campanias.length > 0) {
    campanias.forEach(c => {
      if (!camPorLabel[c.fecha_label]) camPorLabel[c.fecha_label] = [];
      camPorLabel[c.fecha_label].push(c);
    });
  }

  // Plugin para dibujar líneas verticales en fechas con campañas
  const campaniaLines = {
    id: 'campaniaLines',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea) return;
      Object.keys(camPorLabel).forEach(label => {
        const idx = labelsChart.indexOf(label);
        if (idx === -1) return;
        const x = scales.x.getPixelForValue(idx);
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = 'rgba(236, 72, 153, 0.5)';
        ctx.lineWidth = 1.5;
        ctx.moveTo(x, chartArea.top);
        ctx.lineTo(x, chartArea.bottom);
        ctx.stroke();
        // Icono arriba de la línea
        ctx.setLineDash([]);
        ctx.fillStyle = '#ec4899';
        ctx.font = '14px Inter';
        ctx.textAlign = 'center';
        ctx.fillText('📣', x, chartArea.top - 4);
        ctx.restore();
      });
    }
  };

  chartEvolucion = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labelsChart,
      datasets: [
        {
          label: 'Leads',
          data: evolucion.map(e => e.leads),
          borderColor: '#6366f1',
          backgroundColor: 'rgba(99,102,241,0.1)',
          borderWidth: 2,
          tension: 0.35,
          fill: true,
          pointRadius: 3,
          pointBackgroundColor: '#6366f1',
          pointBorderWidth: 0
        },
        {
          label: 'Confirmaciones',
          data: evolucion.map(e => e.confirmados),
          borderColor: '#f59e0b',
          backgroundColor: 'rgba(245,158,11,0.1)',
          borderWidth: 2,
          tension: 0.35,
          fill: true,
          pointRadius: 3,
          pointBackgroundColor: '#f59e0b',
          pointBorderWidth: 0
        },
        {
          label: 'Altas',
          data: evolucion.map(e => e.altas),
          borderColor: '#10b981',
          backgroundColor: 'rgba(16,185,129,0.1)',
          borderWidth: 2,
          tension: 0.35,
          fill: true,
          pointRadius: 3,
          pointBackgroundColor: '#10b981',
          pointBorderWidth: 0
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            color: '#8b93a7',
            font: { size: 11, family: 'Inter' },
            usePointStyle: true,
            pointStyle: 'circle',
            padding: 14
          }
        },
        tooltip: {
          backgroundColor: '#0a0e1a',
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1,
          titleColor: '#e8ecf4',
          bodyColor: '#8b93a7',
          padding: 10,
          callbacks: {
            afterBody: function(tooltipItems) {
              const label = tooltipItems[0].label;
              const cams = camPorLabel[label];
              if (!cams || cams.length === 0) return null;
              return ['', '📣 Campañas ese día:', ...cams.map(c =>
                `  · ${c.canal} ${c.tipo}: ${c.cantidad.toLocaleString('es-AR')}`
              )];
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.04)' },
          ticks: { color: '#5a6178', font: { size: 11 } },
          border: { display: false }
        },
        y: {
          grid: { color: 'rgba(255,255,255,0.04)' },
          ticks: { color: '#5a6178', font: { size: 11 }, precision: 0 },
          border: { display: false },
          beginAtZero: true
        }
      }
    },
    plugins: [campaniaLines]
  });
}

// EVENTOS
document.querySelectorAll('#rangeFilters .range-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#rangeFilters .range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRange = btn.dataset.range;
    cargar();
  });
});

document.getElementById('customApply').addEventListener('click', () => {
  const from = document.getElementById('customFrom').value;
  const to = document.getElementById('customTo').value;
  if (!from || !to) return alert('Elegí ambas fechas');
  document.querySelectorAll('#rangeFilters .range-btn').forEach(b => b.classList.remove('active'));
  currentRange = 'custom';
  currentFrom = from;
  currentTo = to;
  cargar();
});

cargar();
setInterval(cargar, REFRESH_MS);
</script>
</body>
</html>
